<!doctype html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ผู้ช่วยโภชนาการเบาหวาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%); }
        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .message-bubble { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- Chat Area -->
    <main id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 messages-area">
        <div class="message-bubble flex gap-3">
            <div class="w-10 h-10 rounded-full bg-pink-500 flex-shrink-0 flex items-center justify-center text-white mt-1 shadow-md font-bold">AI</div>
            <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] border border-gray-100 text-lg">
                สวัสดีค่ะคุณตาคุณยาย 😊 ปรึกษาเรื่องอาหารเบาหวานได้ที่นี่เลยนะคะ พิมพ์ชื่ออาหารที่อยากทานมาได้เลยค่ะ 💚
            </div>
        </div>
    </main>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="hidden px-4 py-2 absolute bottom-24 left-0 w-full z-10">
        <div class="flex gap-3 items-center bg-white/90 backdrop-blur-sm w-fit px-4 py-2 rounded-full shadow-sm border border-gray-100">
            <span class="text-sm text-gray-600">กำลังหาคำตอบให้สักครู่นะคะ...</span>
        </div>
    </div>

    <!-- Input Area -->
    <footer class="bg-white border-t border-gray-200 p-3 sm:p-4 z-20">
        <form id="chatForm" onsubmit="handleSend(event)" class="max-w-4xl mx-auto flex gap-2 sm:gap-3">
            <input 
                type="text" 
                id="userInput" 
                class="flex-1 bg-gray-50 border-2 border-gray-200 text-gray-900 text-lg rounded-full focus:ring-pink-500 focus:border-pink-500 block w-full p-3 sm:p-4 outline-none shadow-inner" 
                placeholder="ปรึกษาเรื่องอาหารได้ที่นี่" 
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-[#0cc0df] hover:bg-[#0ab0cd] text-white font-medium rounded-full text-lg px-6 sm:px-10 py-3 sm:py-4 shadow-lg transition-all active:scale-95 disabled:opacity-50"
            >
                ส่ง
            </button>
        </form>
    </footer>

    <script>
        // ใส่ API Key ที่คุณให้มาเรียบร้อยแล้ว
        const apiKey = "AIzaSyA4DY_9GGsZFzEjJmeirEl3u5vafyMoRu4"; 
        
        // แนะนำให้ใช้ gemini-1.5-flash เพื่อความเสถียรสูงสุดในตอนนี้
        const MODEL_NAME = "gemini-1.5-flash"; 

        const SYSTEM_PROMPT = `คุณคือผู้เชี่ยวชาญด้านโภชนาการสำหรับผู้ป่วยเบาหวานและผู้สูงอายุ
บทบาทของคุณคือ: "หมออาหารใจดี"
กลุ่มเป้าหมาย: ผู้สูงอายุชาวไทยที่เป็นโรคเบาหวาน

แนวทางการตอบ:
1. **สำคัญที่สุด**: ต้องตอบให้ "สั้น กระชับ เข้าใจง่าย" (ไม่เกิน 3-4 บรรทัด) เพื่อให้ผู้สูงอายุอ่านสบายตา ไม่ตาลาย
2. ฟันธงเลยว่า "ทานได้" "ทานได้นิดหน่อย" หรือ "ควรเลี่ยง" แล้วบอกเหตุผลสั้นๆ
3. ใช้ภาษาไทยที่สุภาพ อ่อนโยน เหมือนลูกหลานคุยกับญาติผู้ใหญ่ ลงท้าย "ค่ะ/ครับ"
4. หลีกเลี่ยงศัพท์วิชาการยากๆ
5. ถ้าอาหารนั้นอันตราย ให้เสนอทางเลือกอื่นที่ปลอดภัยทันที
6. ใช้ Emoji ประกอบเล็กน้อย 🥗🍎💚

ตัวอย่าง:
Q: "ป้าอยากกินข้าวเหนียวมะม่วง"
A: "ทานได้เพียงเล็กน้อยค่ะคุณป้า 😊 เพราะน้ำตาลและกะทิสูงมาก แนะนำให้ทานแค่ 1-2 คำพอหายอยาก หรือเปลี่ยนเป็นผลไม้น้ำตาลต่ำอย่างฝรั่งหรือแก้วมังกรแทนจะดีต่อสุขภาพมากกว่าค่ะ"`;

        const messagesArea = document.getElementById('messagesArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        let chatHistory = [];

        async function handleSend(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            setUIState(true);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            ...chatHistory,
                            { role: "user", parts: [{ text: text }] }
                        ],
                        systemInstruction: {
                            parts: [{ text: SYSTEM_PROMPT }]
                        }
                    })
                });

                const data = await response.json();

                if (data.error) {
                    console.error("API Error:", data.error);
                    let errorMsg = data.error.message;
                    if (data.error.status === "PERMISSION_DENIED") {
                        errorMsg = "API Key นี้ถูกจำกัดการเข้าถึง (โปรดตรวจสอบการตั้งค่า Browser Restrictions ใน Google Cloud)";
                    }
                    throw new Error(errorMsg);
                }

                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    addMessage(reply, 'ai');
                    chatHistory.push({ role: "user", parts: [{ text: text }] });
                    chatHistory.push({ role: "model", parts: [{ text: reply }] });
                } else {
                    throw new Error("ขออภัยค่ะ AI ไม่สามารถตอบคำถามนี้ได้ในขณะนี้");
                }

            } catch (error) {
                console.error("Fetch Error:", error);
                addMessage(`❌ ขออภัยค่ะ: ${error.message}`, 'ai');
            } finally {
                setUIState(false);
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message-bubble flex gap-3 ${sender === 'user' ? 'justify-end' : ''}`;
            
            if (sender === 'ai') {
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-pink-500 flex-shrink-0 flex items-center justify-center text-white mt-1 shadow-md font-bold">AI</div>
                    <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] border border-gray-100 text-lg text-gray-800">${marked.parse(text)}</div>
                `;
            } else {
                div.innerHTML = `
                    <div class="bg-[#0cc0df] p-4 rounded-2xl rounded-tr-none shadow-md max-w-[85%] text-white text-lg">${text}</div>
                `;
            }
            messagesArea.appendChild(div);
            messagesArea.scrollTo({ top: messagesArea.scrollHeight, behavior: 'smooth' });
        }

        function setUIState(isLoading) {
            typingIndicator.classList.toggle('hidden', !isLoading);
            userInput.disabled = isLoading;
            sendBtn.disabled = isLoading;
            if (!isLoading) userInput.focus();
        }
    </script>
</body>
</html>
