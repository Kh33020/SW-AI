<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SWEETCARE - AI Nutrition Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0cc0df', // Turquoise Blue
                        accent: '#ec4899',  // Pink
                        textMain: '#1f2937', // Dark Gray
                        bgStart: '#e0f2fe', // Light Blue
                        bgEnd: '#fce7f3',   // Light Pink
                        typingDots: '#94a3b8',
                        scrollTrack: '#f1f5f9',
                        scrollThumb: '#cbd5e1'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            font-size: 18px;
            /* Background Gradient as requested */
            background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%);
            color: #1f2937;
        }
        
        .chat-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px;
            position: relative;
            z-index: 1;
        }
        
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 2px solid #e5e7eb;
            padding: 20px;
            z-index: 10;
        }
        
        .message-bubble {
            animation: fadeInUp 0.4s ease-out;
            margin-bottom: 16px;
            display: flex;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .typing-indicator {
            display: none;
            padding: 10px 20px;
            margin-bottom: 10px;
        }
        
        .typing-indicator.active {
            display: flex;
            animation: fadeInUp 0.4s ease-out;
        }
        
        .typing-dot {
            width: 10px;
            height: 10px;
            background: #94a3b8; /* typing dots color */
            border-radius: 50%;
            margin: 0 3px;
            animation: typingBounce 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-12px); }
        }
        
        .scroll-smooth {
            scroll-behavior: smooth;
        }
        
        /* Improved scrollbar as requested */
        .messages-area::-webkit-scrollbar {
            width: 8px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: #f1f5f9; /* scrollbar track */
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* scrollbar thumb */
            border-radius: 4px;
        }
        .messages-area::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Hide unwanted elements */
        [class*="watermark"], [class*="branding"], [class*="canva"],
        div[style*="position: fixed"][style*="bottom"],
        div[style*="position: absolute"][style*="bottom"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        .background-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.05;
            z-index: 0;
            pointer-events: none;
            width: 280px;
            height: 280px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Background Logo (Primary color) -->
        <div class="background-logo">
            <svg viewBox="0 0 24 24" fill="currentColor" style="color: #0cc0df;">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Messages Area -->
        <main class="messages-area scroll-smooth" id="chatMessages">
            <!-- AI Welcome Message -->
            <div class="message-bubble items-start space-x-2">
                <!-- AI Icon (Accent Color) -->
                <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 mt-1 shadow-md" style="background-color: #ec4899;">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <!-- AI Bubble (White with border) -->
                <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 max-w-[85%] text-slate-800">
                    สวัสดีค่ะ! SWEETCARE AI พร้อมแนะนำการทานอาหารสำหรับผู้ป่วยเบาหวานแล้วค่ะ สงสัยเรื่องไหนสอบถามได้เลยนะคะ 😊
                </div>
            </div>

            <!-- Typing Indicator -->
            <div id="typingIndicator" class="typing-indicator items-center ml-12">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-area">
            <div class="flex items-center space-x-2 max-w-4xl mx-auto">
                <input 
                    type="text" 
                    id="userInput"
                    placeholder="พิมพ์คำถามที่นี่..." 
                    class="flex-1 bg-slate-50 border border-gray-200 rounded-2xl px-5 py-4 focus:ring-2 outline-none text-slate-700 shadow-inner"
                    style="--tw-ring-color: #0cc0df;"
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button 
                    onclick="sendMessage()"
                    class="text-white rounded-2xl p-4 transition-all active:scale-95 shadow-md"
                    style="background-color: #0cc0df;"
                >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // API Configuration
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";
        const API_KEY = "AIzaSyARmwGec6nI55iv2pXzZVVZPEo9Rppc7Dg";
        
        const chatContainer = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');
        const userInput = document.getElementById('userInput');

        const SYSTEM_PROMPT = `คุณคือผู้เชี่ยวชาญด้านโภชนาการสำหรับผู้ป่วยเบาหวานและผู้สูงอายุ
บทบาทของคุณคือ: "หมออาหารใจดี"
กลุ่มเป้าหมาย: ผู้สูงอายุชาวไทยที่เป็นโรคเบาหวาน

แนวทางการตอบ:
1. **สำคัญที่สุด**: ต้องตอบให้ "สั้น กระชับ เข้าใจง่าย" (ไม่เกิน 3-4 บรรทัด) เพื่อให้ผู้สูงอายุอ่านสบายตา ไม่ตาลาย
2. ฟันธงเลยว่า "ทานได้" "ทานได้นิดหน่อย" หรือ "ควรเลี่ยง" แล้วบอกเหตุผลสั้นๆ
3. ใช้ภาษาไทยที่สุภาพ อ่อนโยน เหมือนลูกหลานคุยกับญาติผู้ใหญ่ ลงท้าย "ค่ะ/ครับ"
4. หลีกเลี่ยงศัพท์วิชาการยากๆ
5. ถ้าอาหารนั้นอันตราย ให้เสนอทางเลือกอื่นที่ปลอดภัยทันที
6. ใช้ Emoji ประกอบเล็กน้อย 🥗🍎💚

ตัวอย่าง:
Q: "ป้าอยากกินข้าวเหนียวมะม่วง"
A: "ทานได้เพียงเล็กน้อยค่ะคุณป้า 😊 เพราะน้ำตาลและกะทิสูงมาก แนะนำให้ทานแค่ 2-3 คำพอหายอยาก หรือเปลี่ยนเป็นผลไม้น้ำตาลต่ำอย่างฝรั่งหรือแก้วมังกรแทนจะดีต่อสุขภาพมากกว่าค่ะ 💚"`;

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            userInput.value = '';
            
            showLoading(true);

            try {
                const fetchWithRetry = async (retries = 3) => {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-goog-api-key': API_KEY
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `${SYSTEM_PROMPT}\n\nคำถามจากผู้ใช้: ${message}`
                                }]
                            }]
                        })
                    });

                    if (!response.ok) {
                        if (retries > 0) {
                            await new Promise(res => setTimeout(res, 1000));
                            return fetchWithRetry(retries - 1);
                        }
                        throw new Error('API Error');
                    }
                    return response;
                };

                const response = await fetchWithRetry();
                const data = await response.json();
                const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "ขออภัยค่ะ ฉันไม่สามารถประมวลผลคำตอบได้ในขณะนี้";
                
                appendMessage(aiResponse, 'ai');
            } catch (error) {
                appendMessage("ขออภัยค่ะ เกิดข้อผิดพลาดในการเชื่อมต่อระบบ ลองใหม่อีกครั้งนะคะ 🙏", 'ai');
            } finally {
                showLoading(false);
            }
        }

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-bubble ${sender === 'user' ? 'justify-end' : 'items-start space-x-2'}`;
            
            if (sender === 'user') {
                wrapper.innerHTML = `
                    <div class="text-white p-4 rounded-2xl rounded-tr-none shadow-md max-w-[85%]" style="background-color: #0cc0df;">
                        <p class="leading-relaxed">${text}</p>
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 mt-1 shadow-md" style="background-color: #ec4899;">
                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                    <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 max-w-[85%] text-slate-800">
                        <p class="leading-relaxed">${text}</p>
                    </div>
                `;
            }
            
            chatContainer.insertBefore(wrapper, typingIndicator);
            scrollToBottom();
        }

        function showLoading(show) {
            if (show) {
                typingIndicator.classList.add('active');
            } else {
                typingIndicator.classList.remove('active');
            }
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        window.onload = () => userInput.focus();
    </script>
</body>
</html>
