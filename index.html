<!doctype html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ผู้ช่วยโภชนาการเบาหวาน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Markdown Parser for AI responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%);
        }

        /* Custom Scrollbar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-bubble {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Typing Indicator */
        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Text formatting */
        .prose p { margin-bottom: 0.5em; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.5em; }
        .prose strong { color: #db2777; font-weight: 600; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- Header removed as requested -->

    <!-- Chat Area -->
    <main id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 messages-area">
        <!-- Welcome Message -->
        <div class="message-bubble flex gap-3">
            <div class="w-10 h-10 rounded-full bg-pink-500 flex-shrink-0 flex items-center justify-center text-white mt-1 shadow-md">
                <span class="font-bold text-lg">AI</span>
            </div>
            <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] border border-gray-100">
                <p class="text-gray-800 text-lg">สวัสดีค่ะ 😊 ดิฉันคือ AI ผู้ช่วยดูแลเรื่องอาหารสำหรับผู้ป่วยเบาหวานค่ะ <br><br>วันนี้คุณอยากทานอะไร หรืออยากปรึกษาเรื่องเมนูไหน ถามได้เลยนะคะ ยินดีดูแลค่ะ 💚</p>
            </div>
        </div>
    </main>

    <!-- Typing Indicator (Hidden by default) -->
    <div id="typingIndicator" class="hidden px-4 py-2 absolute bottom-24 left-0 w-full z-0">
        <div class="flex gap-3 items-center bg-white/80 backdrop-blur-sm w-fit px-4 py-2 rounded-full shadow-sm border border-gray-100">
            <span class="text-sm text-gray-500">กำลังพิมพ์...</span>
            <div class="flex space-x-1">
                <div class="w-2 h-2 bg-pink-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-pink-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-pink-400 rounded-full typing-dot"></div>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <footer class="bg-white border-t border-gray-200 p-3 sm:p-4 z-20">
        <form id="chatForm" onsubmit="handleSend(event)" class="max-w-4xl mx-auto flex gap-2 sm:gap-3">
            <input 
                type="text" 
                id="userInput" 
                class="flex-1 bg-gray-50 border-2 border-gray-200 text-gray-900 text-lg rounded-full focus:ring-pink-500 focus:border-pink-500 block w-full p-3 sm:p-4 transition-colors" 
                placeholder="ปรึกษาเรื่องอาหารได้ที่นี่" 
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-[#0cc0df] hover:bg-[#0ab0cd] text-white font-medium rounded-full text-lg px-6 sm:px-8 py-3 sm:py-4 shadow-lg transition-transform active:scale-95 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <span>ส่ง</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </form>
    </footer>

    <script>
        // --- Configuration ---
        // ⚠️ สำคัญ: ใส่ API Key ของคุณที่นี่ หากนำไปใช้จริงนอก Canvas
        const apiKey = "AIzaSyAboz5aMYJ3aCw0_R4XBqa03flcLZ7-xBo"; 
        
        // ใช้ Gemini Model ล่าสุด
        const MODEL_NAME = "gemini-1.5-flash"; 

        const SYSTEM_PROMPT = `
คุณคือผู้เชี่ยวชาญด้านโภชนาการสำหรับผู้ป่วยเบาหวานและผู้สูงอายุ
บทบาทของคุณคือ: "หมออาหารใจดี"
กลุ่มเป้าหมาย: ผู้สูงอายุชาวไทยที่เป็นโรคเบาหวาน

แนวทางการตอบ:
1. **สำคัญที่สุด**: ต้องตอบให้ "สั้น กระชับ เข้าใจง่าย" (ไม่เกิน 3-4 บรรทัด) เพื่อให้ผู้สูงอายุอ่านสบายตา ไม่ตาลาย
2. ฟันธงเลยว่า "ทานได้" "ทานได้นิดหน่อย" หรือ "ควรเลี่ยง" แล้วบอกเหตุผลสั้นๆ
3. ใช้ภาษาไทยที่สุภาพ อ่อนโยน เหมือนลูกหลานคุยกับญาติผู้ใหญ่ ลงท้าย "ค่ะ/ครับ"
4. หลีกเลี่ยงศัพท์วิชาการยากๆ
5. ถ้าอาหารนั้นอันตราย ให้เสนอทางเลือกอื่นที่ปลอดภัยทันที
6. ใช้ Emoji ประกอบเล็กน้อย 🥗🍎💚

ตัวอย่าง:
Q: "ป้าอยากกินข้าวเหนียวมะม่วง"
A: "ทานได้เพียงเล็กน้อยค่ะคุณป้า 😊 เพราะน้ำตาลและกะทิสูงมาก แนะนำให้ทานแค่ 1-2 คำพอหายอยาก หรือเปลี่ยนเป็นผลไม้น้ำตาลต่ำอย่างฝรั่งหรือแก้วมังกรแทนจะดีต่อสุขภาพมากกว่าค่ะ 💚"
`;

        // --- Elements ---
        const messagesArea = document.getElementById('messagesArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        let chatHistory = [];

        // --- Functions ---

        async function handleSend(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Show User Message
            addMessage(text, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // 2. Show Typing
            showTyping(true);

            // 3. Call API
            try {
                const responseText = await callGemini(text);
                addMessage(responseText, 'ai');
            } catch (error) {
                console.error(error);
                addMessage("ขออภัยค่ะ ระบบขัดข้องชั่วคราว ลองถามใหม่อีกครั้งนะคะ 🥺", 'ai');
            } finally {
                showTyping(false);
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message-bubble flex gap-3 ${sender === 'user' ? 'justify-end' : ''}`;

            if (sender === 'ai') {
                // Parse Markdown for AI response
                const htmlContent = marked.parse(text);
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-pink-500 flex-shrink-0 flex items-center justify-center text-white mt-1 shadow-md">
                        <span class="font-bold text-lg">AI</span>
                    </div>
                    <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] border border-gray-100 prose prose-pink text-gray-800 text-lg">
                        ${htmlContent}
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <div class="bg-[#0cc0df] p-4 rounded-2xl rounded-tr-none shadow-md max-w-[85%] text-white text-lg">
                        ${escapeHtml(text)}
                    </div>
                    <div class="w-10 h-10 rounded-full bg-[#0cc0df] flex-shrink-0 flex items-center justify-center text-white mt-1 shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                `;
            }

            messagesArea.appendChild(div);
            scrollToBottom();
        }

        async function callGemini(message) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

            // Add new message to history
            chatHistory.push({ role: "user", parts: [{ text: message }] });

            // Prepare payload with System Prompt included via systemInstruction (if supported) or injected
            // For robustness, we inject system prompt in the request structure
            const payload = {
                contents: chatHistory,
                systemInstruction: {
                    parts: [{ text: SYSTEM_PROMPT }]
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.text();
                throw new Error(`API Error: ${err}`);
            }

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            
            // Add AI reply to history
            chatHistory.push({ role: "model", parts: [{ text: reply }] });
            
            return reply;
        }

        function showTyping(show) {
            if (show) {
                typingIndicator.classList.remove('hidden');
                scrollToBottom();
            } else {
                typingIndicator.classList.add('hidden');
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesArea.scrollTo({
                    top: messagesArea.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
